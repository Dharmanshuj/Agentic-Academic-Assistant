name: Keep Render services awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping FastAPI service
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 30 https://assistant-fastapi.onrender.com/health

      - name: Ping Spring Boot service
        run: curl -fsS --retry 3 --retry-delay 15 --max-time 90 https://assistant-spring-mcp.onrender.com/health
