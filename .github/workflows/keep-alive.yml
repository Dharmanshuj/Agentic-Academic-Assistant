name: Keep Render services awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping FastAPI service
        run: curl -fsS --max-time 20 https://assistant-fastapi.onrender.com/health

      - name: Ping Spring Boot service
        run: curl -fsS --max-time 20 https://assistant-spring-mcp.onrender.com/health
